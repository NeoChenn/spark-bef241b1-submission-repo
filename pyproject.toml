[project]
name = "rig"
version = "0.1.0"
description = "Offshore rig Isaac Sim stack: sim, web relay, tunnel"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.2",
    "pillow>=13.0.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.8.18,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
