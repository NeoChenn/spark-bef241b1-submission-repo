[project]
name = "rig"
version = "0.1.0"
description = "Offshore rig Isaac Sim stack: sim, web relay, tunnel"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.2",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.8.18,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "sim/tools"]

[dependency-groups]
dev = [
    "fvcore>=0.1.5.post20221221",
    "httpx2>=2.16.0",
    "numpy>=2.5.4",
    "onnx>=1.23.2",
    "onnxruntime>=1.31.1",
    "opencv-python-headless>=5.0.0.93",
    "peft>=0.21.2",
    "pytest>=9.2.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "timm>=1.0.31",
    "torch>=2.15.0",
    "usd-core>=26.11",
    "warp-lang>=1.19.0",
]
train = [
    "huggingface-hub>=2.4.0",
    "imagehash>=4.3.2",
    "imageio>=2.38.1",
    "matplotlib>=3.11.2",
    "modal>=1.6.3",
    "pyarrow>=26.0.1",
    "torchvision>=0.29.2",
]
