<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mission Control</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/static/hud.css">
</head>
<body class="flyby">
  <div id="stage"><div id="backdrop"></div><canvas id="view" width="640" height="360"></canvas></div>
  <div id="shade"></div>
  <div id="labels"></div>

  <div id="capsule" class="glass" aria-live="polite"></div>
  <div id="caption" aria-live="polite"><span class="cap"></span><span class="cap"></span></div>
  <div id="hint"></div>

  <aside id="left" class="glass"></aside>
  <aside id="card" class="glass">
    <header><b data-k="t"></b><kbd data-k="k"></kbd></header>
    <div class="img" data-k="box"><img data-k="img" alt=""><svg data-k="svg"></svg><p class="none" data-k="none"></p></div>
    <p class="cap2" data-k="cap"></p>
  </aside>
  <div id="strip" class="glass"></div>
  <div id="toasts"></div>
  <div id="pulse"></div>

  <div id="spot" class="glass" role="dialog" aria-label="Spotlight">
    <label class="s-search">
      <svg viewBox="0 0 24 24"><path d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14M20 20l-3.6-3.6"/></svg>
      <input id="s-input" placeholder="Scenarios, views, disturbances" autocomplete="off" spellcheck="false" role="combobox" aria-controls="s-list">
    </label>
    <ul id="s-list" role="listbox"></ul>
    <div class="s-foot"><span><i class="dot"></i><span id="status">connecting…</span> · <span id="fps">–</span> fps · <span id="age"></span></span><span><kbd>↑↓</kbd> <kbd>↵</kbd> <kbd>esc</kbd></span></div>
  </div>
  <div id="help" class="glass" role="dialog" aria-label="Keyboard shortcuts"></div>
  <div id="sheet" class="glass" role="dialog"></div>

  <script src="/static/viewer.js"></script>
  <script src="/static/mc.js"></script>
  <script src="/static/bench.js"></script>
  <script src="/static/sound.js"></script>
</body>
</html>
