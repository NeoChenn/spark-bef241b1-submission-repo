name: rig

services:
  web:
    init: true
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    image: rig-web
    network_mode: host
    environment:
      SIM_HOST: "127.0.0.1"
      SIM_PORT: "9000"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CONTROL_CAP_USD: ${CONTROL_CAP_USD:-5}
      RIG_CONTROL_INTERVAL: ${RIG_CONTROL_INTERVAL:-10}
      RIG_MISSION: ${RIG_MISSION:-1}
      RIG_FLEET_SPEED: ${RIG_FLEET_SPEED:-4}
      SIM_HOST_LAN: ${SIM_HOST_LAN:-}
      INGEST_TOKEN: ${INGEST_TOKEN:-}
    volumes:
      - ./runs/control:/app/runs/control
    restart: unless-stopped

  sim:
    init: true
    build:
      context: docker
      dockerfile: sim.Dockerfile
    image: rig-sim:6.2.0
    devices:
      - nvidia.com/gpu=all
    network_mode: host
    depends_on: [web]
    environment:
      ACCEPT_EULA: "Y"
      PRIVACY_CONSENT: "Y"
      NVIDIA_DRIVER_CAPABILITIES: all
      RIG_MERGED: ${RIG_MERGED:-0}
      RIG_MERGED_HOLD: ${RIG_MERGED_HOLD:-8}
      RIG_ATMOS: ${RIG_ATMOS:-}
      RIG_WEATHER: ${RIG_WEATHER:-}
      RENDER_MODE: ${RENDER_MODE:-local}
      RIG_VIEWS: ${RIG_VIEWS:-0}
      RIG_VIEWS_RATE: ${RIG_VIEWS_RATE:-2}
      RIG_VIEWS_MODE: ${RIG_VIEWS_MODE:-RaytracedLighting}
    command:
      - /rig/rig/sim/main.py
      - --sim=127.0.0.1:9000
      - --cinematic=${RIG_CINEMATIC:-night}
      - --renderer=RealTimePathTracing
      - --width=1280
      - --height=720
      - --spp=1
      - --subframes=1
      - --bounces=6
      - --set=/rtx/rtpt/maxSpecularAndTransmissionBounces=6
      - --set=/rtx/post/dlss/execMode=2
      - --fps=24
      - --quality=80
    volumes:
      - ./rig:/rig/rig:ro
      - ./sim:/rig/sim:ro
      - ./logs:/logs
      - rig-isaac-cache-main:/isaac-sim/.cache
      - rig-isaac-cache-compute:/isaac-sim/.nv/ComputeCache
      - rig-isaac-cache-kit:/isaac-sim/kit/cache
      - rig-isaac-ovlogs:/isaac-sim/.nvidia-omniverse/logs
      - rig-isaac-config:/isaac-sim/.nvidia-omniverse/config
      - rig-isaac-data:/isaac-sim/.local/share/ov/data
    restart: unless-stopped

  tunnel:
    init: true
    profiles: ["public"]
    image: cloudflare/cloudflared:2026.9.3
    command: tunnel --no-autoupdate run
    network_mode: host
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    restart: unless-stopped

volumes:
  rig-isaac-cache-main:
    name: rig-isaac-cache-main
  rig-isaac-cache-compute:
    name: rig-isaac-cache-compute
  rig-isaac-cache-kit:
    name: rig-isaac-cache-kit
  rig-isaac-ovlogs:
    name: rig-isaac-ovlogs
  rig-isaac-config:
    name: rig-isaac-config
  rig-isaac-data:
    name: rig-isaac-data
