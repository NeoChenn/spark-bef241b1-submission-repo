<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Conclusion</title>
<link rel="stylesheet" href="film.css">
<style>
  .card { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); text-align: center; opacity: 0; }
  .card p { margin: 0 auto; max-width: 1560px; font: 300 54px/1.25 var(--sans); letter-spacing: -0.02em; color: rgba(255, 255, 255, 0.94); text-shadow: 0 2px 24px rgba(0, 0, 0, 0.45); }
  .card p b { font-weight: 400; color: #fff; }
  .card small { display: block; margin-top: 22px; font: 400 20px/1.3 var(--mono); color: rgba(235, 235, 245, 0.55); letter-spacing: 0; }
  .card i { display: block; width: 44px; height: 2px; margin: 0 auto 34px; border-radius: 1px; background: var(--accent); opacity: 0.85; }
</style>
</head>
<body>
<div id="cards"></div>
<script src="film.js"></script>
<script>
  const { fade, $, esc, data } = K, C = data.cards || [], L = data.span || 12, X = 0.5;
  $("cards").innerHTML = C.map((c, i) => `<div class="card" id="c-${i}"><i></i><p>${c.lines ? c.lines.map((l, j) => `<span class="ln" id="l-${i}-${j}">${esc(l)}</span>`).join("<br>") : c.html || esc(c.text)}</p>${c.sub ? `<small>${esc(c.sub)}</small>` : ""}</div>`).join("");
  const slot = L / Math.max(1, C.length);
  window.render = (t) => {
    C.forEach((c, i) => {
      const a = i * slot, b = (i + 1) * slot, last = i === C.length - 1;
      const o = (i === 0 ? fade(t, 0, X) : fade(t, a - X / 2, a + X / 2)) * (last ? 1 : 1 - fade(t, b - X / 2, b + X / 2));
      const e = $("c-" + i);
      e.style.opacity = o;
      (c.lines || []).forEach((l, j) => { if (j) $(`l-${i}-${j}`).style.opacity = fade(t, a + 0.9 * j, a + 0.9 * j + X); });
      e.style.transform = `translateY(calc(-50% + ${(1 - o) * 6}px))`;
    });
    return true;
  };
  window.render(0);
</script>
</body>
</html>
